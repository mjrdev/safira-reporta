name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safira
          POSTGRES_USER: safira
          POSTGRES_PASSWORD: safira-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safira"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://safira:safira-ci@localhost:5432/safira
      SECRET_KEY: ci-somente-para-testes
      PHONE_HASH_KEY: ci-somente-para-testes
      DEBUG: "0"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Verificar migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Testes unitários e de integração (com cobertura)
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Checagem de segurança do Django
        run: python manage.py check --deploy --fail-level ERROR
        env:
          ALLOWED_HOSTS: safira.example.org

      - name: Auditoria de dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Build da imagem Docker
        run: docker build -t safira-reporta:${{ github.sha }} .

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
