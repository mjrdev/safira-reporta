# Blueprint do Render: cria o banco PostgreSQL e o serviço web do Safira Reporta.
# No Render: New > Blueprint > escolha este repositório.
databases:
  - name: safira-db
    plan: free
    databaseName: safira
    user: safira

services:
  - type: web
    name: safira-reporta
    runtime: python
    plan: free
    region: ohio
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    # O build não acessa a rede privada do Render (onde está o banco) e o plano free
    # não tem preDeployCommand: migrate e usuário inicial rodam no início do start.
    startCommand: >-
      python manage.py migrate --noinput &&
      (python manage.py createsuperuser --noinput || true) &&
      gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /saude/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: safira-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PHONE_HASH_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_PATH
        value: gestao-associacao/
      # Usuário inicial do painel (crie a senha no Render, nunca no repositório)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Monitoramento de erros (opcional)
      - key: SENTRY_DSN
        sync: false
      # Fotos no Supabase Storage (recomendado: o disco do plano free é apagado a cada deploy)
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
